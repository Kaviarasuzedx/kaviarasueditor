<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Social Contact Cards</title><style>*{box-sizing:border-box}body{margin:0;background:#08080c;color:#eee;font:16px Arial,sans-serif;padding:clamp(16px,5vw,64px)}main{max-width:1200px;margin:auto}h1{font-size:clamp(26px,4vw,48px);letter-spacing:-.04em;margin:0 0 8px}p{color:#a1a1ad;margin:0 0 28px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.hero{max-width:850px;margin:0 auto 40px}@media(max-width:650px){.grid{grid-template-columns:1fr;gap:16px}}</style></head><body><main><h1>Let’s connect.</h1><p>Interactive contact card collection · Preview destinations are not configured.</p><div class="hero"><social-contact-card platform="Discord"></social-contact-card></div><div class="grid"><social-contact-card platform="Instagram"></social-contact-card><social-contact-card platform="Telegram"></social-contact-card><social-contact-card platform="Gmail" label="Send me an email"></social-contact-card><social-contact-card platform="LinkedIn"></social-contact-card><social-contact-card platform="X"></social-contact-card></div></main><script type="module" src="./card.js"></script></body></html>
