<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Premium brand motion</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101011;font-family:Arial,sans-serif}.card{width:min(100%,720px);background:#101011;border-radius:12px;overflow:hidden}svg{width:100%;display:block}button{border:1px solid #665334;background:#24211b;color:#e9c37d;padding:9px 18px;border-radius:7px;cursor:pointer}.orbit{transform-origin:210px 171px;animation:spin 14s linear infinite}.reverse{transform-origin:210px 171px;animation:spin 19s linear infinite reverse}.product{animation:float 4s ease-in-out infinite;transform-origin:210px 180px}.brand{animation:letters 4s ease-in-out infinite}.shine{animation:shine 4s ease-in-out infinite}.halo{animation:breathe 4s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}@keyframes letters{0%,100%{letter-spacing:3px}50%{letter-spacing:6px}}@keyframes shine{0%,20%{transform:translateX(-140px)}70%,100%{transform:translateX(160px)}}@keyframes breathe{50%{opacity:.5}}.paused svg *{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){.card:not(.playing) svg *{animation-play-state:paused}}</style></head><body><main class="card">
<svg viewBox="0 0 420 355" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated black and gold brand product">
<defs><radialGradient id="bg"><stop stop-color="#71500b" stop-opacity=".65"/><stop offset="1" stop-color="#101011"/></radialGradient><linearGradient id="bottle" x2="1" y2="1"><stop stop-color="#393939"/><stop offset=".7" stop-color="#111113"/></linearGradient><linearGradient id="gold"><stop stop-color="#8a5716"/><stop offset=".5" stop-color="#edc473"/><stop offset="1" stop-color="#a26b17"/></linearGradient><linearGradient id="sweep"><stop stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white" stop-opacity=".65"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern><clipPath id="label"><rect x="158" y="185" width="104" height="53" rx="5"/></clipPath></defs>
<rect width="420" height="355" fill="url(#bg)" class="halo"/><rect width="420" height="355" fill="url(#grid)"/>
<g class="orbit" fill="none" stroke="#be902e"><circle cx="210" cy="171" r="139" opacity=".4"/><path d="M210 32 A139 139 0 0 1 347 150" stroke-width="2" opacity=".85"/><circle cx="210" cy="32" r="3" fill="#f1cf83"/></g>
<g class="reverse"><circle cx="210" cy="171" r="108" fill="none" stroke="#bb8a29" stroke-dasharray="3 8" opacity=".5"/><circle cx="102" cy="171" r="2.5" fill="#e9ba62"/><path d="M65 80L121 118 M315 118L340 80" stroke="#b98a25" stroke-width="2" opacity=".6"/></g>
<ellipse cx="210" cy="295" rx="86" ry="8" fill="#000" opacity=".5"/><g class="product"><path d="M163 116L248 110L283 276H130Z" fill="url(#bottle)" stroke="url(#gold)" stroke-width="2"/><rect x="183" y="81" width="55" height="39" rx="9" fill="#353535" stroke="url(#gold)" stroke-width="1.5"/><rect x="158" y="185" width="104" height="53" rx="5" fill="url(#gold)"/><g clip-path="url(#label)"><g class="shine"><rect x="165" y="170" width="35" height="85" fill="url(#sweep)" transform="skewX(-15)"/></g></g><text class="brand" x="210" y="216" fill="#151515" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="17" letter-spacing="3">BRAND</text></g><path d="M120 295H300" stroke="#c4912d" opacity=".7"/></svg>
<div style="display:flex;justify-content:center;padding:0 0 14px"><button id="toggle" type="button">Pause animation</button></div></main><script>const card=document.querySelector('.card'),button=document.querySelector('#toggle');let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;function render(){card.classList.toggle('paused',paused);card.classList.toggle('playing',!paused);button.textContent=paused?'Play animation':'Pause animation';}button.addEventListener('click',()=>{paused=!paused;render()});render();</script></body></html>
